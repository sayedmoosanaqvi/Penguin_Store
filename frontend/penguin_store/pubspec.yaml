name: penguin_store
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  http: ^1.6.0
  jwt_decoder: ^2.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  model_viewer_plus: ^1.10.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_penguin.png"
  adaptive_icon_background: "#FFC107" # This paints the professional yellow background
  adaptive_icon_foreground: "assets/logo_penguin.png" # This places your penguin on top
  min_sdk_android: 21