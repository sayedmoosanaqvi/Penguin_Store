
name: penguin_store
description: Penguin Store - AI Powered Shopping Experience
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  http: ^1.6.0
  jwt_decoder: ^2.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  model_viewer_plus: ^1.10.0
  shimmer: ^3.0.0
  flutter_stripe: ^12.6.0
  flutter_stripe_web: ^7.6.0
  url_launcher: ^6.3.2
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter_local_notifications: ^22.3.1
  uuid: ^4.6.0
  http_parser: ^4.1.2
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/videos/penguinstore_splash_animation.mp4
    - assets/videos/app_icon.png.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/videos/app_icon.png.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/videos/app_icon.png.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/videos/app_icon.png.png"
    background_color: "#1E88E5"
    theme_color: "#1E88E5"

  windows:
    generate: true
    image_path: "assets/videos/app_icon.png.png"
    icon_size: 48
