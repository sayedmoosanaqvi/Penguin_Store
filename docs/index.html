<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/Penguin_Store/">
  <script>
    (function() {
      var h = window.location.hostname;
      var base = document.querySelector('base');
      if (h === 'penguinstore.co' || h === 'www.penguinstore.co' || h === 'localhost' || h === '127.0.0.1') {
        if (base) base.setAttribute('href', '/');
      } else if (h.indexOf('.github.io') !== -1) {
        if (base) base.setAttribute('href', '/Penguin_Store/');
      }
      // Purge any legacy PWA service workers so stale MaterialIcons / AssetManifest caches never cause broken cross icons
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            var scriptUrl = (regs[i].active && regs[i].active.scriptURL) || '';
            if (scriptUrl.indexOf('flutter_service_worker') !== -1) {
              regs[i].unregister();
            }
          }
        }).catch(function() {});
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <!-- Open Graph / Facebook / LinkedIn -->

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://penguin-store-backend.onrender.com" crossorigin>

  <!-- External SDKs (deferred off critical first-paint path) -->
  <script src="https://js.stripe.com/v3/" defer></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js" defer></script>

  <script>
    // WebGL Context Loss & Restoration Safety Net (CanvasKit + <model-viewer>)
    window.addEventListener('webglcontextlost', function(event) {
      console.warn('[WebGL Watchdog] WebGL context lost detected on CanvasKit/DOM canvas. Preventing default to allow recovery.', event);
      event.preventDefault();
    }, false);
    window.addEventListener('webglcontextrestored', function(event) {
      console.info('[WebGL Watchdog] WebGL context successfully restored.', event);
    }, false);
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b132b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #penguin-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 38%, #13294b 0%, #0b132b 72%);
      transition: opacity 260ms ease-out;
    }
    #penguin-boot-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .penguin-boot-badge {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1e88e5 0%, #00acc1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(30, 136, 229, 0.38);
      margin-bottom: 18px;
    }
    .penguin-boot-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #f8fafc;
      margin: 0 0 6px 0;
    }
    .penguin-boot-sub {
      font-size: 12.5px;
      color: #94a3b8;
      margin: 0 0 20px 0;
    }
    .penguin-boot-bar {
      width: 148px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .penguin-boot-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #38bdf8, #00e5ff);
      animation: penguinBootSlide 1.05s ease-in-out infinite alternate;
    }
    @keyframes penguinBootSlide {
      from { transform: translateX(-15%); }
      to { transform: translateX(135%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .penguin-boot-bar::after { animation: none; width: 100%; }
      #penguin-boot-loader { transition: none; }
    }
  </style>
</head>
<body>
  <div id="penguin-boot-loader" role="status" aria-live="polite" aria-label="Loading Penguin Store">
    <div class="penguin-boot-badge" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c-3.8 0-6.5 3.1-6.5 7.4 0 3.3-1.3 5.3-1.8 6.4-.3.7.2 1.5 1 1.5h14.6c.8 0 1.3-.8 1-1.5-.5-1.1-1.8-3.1-1.8-6.4C18.5 6.1 15.8 3 12 3z"/>
        <circle cx="10" cy="8.5" r="0.9" fill="#ffffff"/>
        <circle cx="14" cy="8.5" r="0.9" fill="#ffffff"/>
        <path d="M10.5 11l1.5 1.4L13.5 11"/>
      </svg>
    </div>
    <p class="penguin-boot-title">Penguin Store</p>
    <p class="penguin-boot-sub">AI-Powered 3D &amp; Voice Commerce</p>
    <div class="penguin-boot-bar" aria-hidden="true"></div>
  </div>
  <script>
    (function() {
      function dismissBootLoader() {
        var el = document.getElementById('penguin-boot-loader');
        if (!el) return;
        el.classList.add('fade-out');
        setTimeout(function() {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 280);
      }
      window.addEventListener('flutter-first-frame', dismissBootLoader, { once: true });
      setTimeout(dismissBootLoader, 7000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
